[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-rag"
version = "0.2.0"
description = "Retrieval-Augmented Generation toolkit with hybrid retrieval, pluggable embeddings and an evaluation harness."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["nlp", "rag", "retrieval", "embeddings", "question-answering"]
dependencies = [
    "numpy>=1.24",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.2"]
faiss = ["faiss-cpu>=1.7"]
transformers = ["transformers>=4.30", "torch>=2.0"]
anthropic = ["anthropic>=0.49"]
dev = ["pytest>=7.4"]

[project.scripts]
nlp-rag = "nlp_rag.cli:main"

[tool.setuptools]
packages = ["nlp_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
